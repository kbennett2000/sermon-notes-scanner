<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sermon Scanner README banner (Brand bar, amber).
  Source of truth for assets/banner.png (rendered at 2x via headless Chrome).
  Brand: white open-book glyph on amber #FF8F00 — matches the app's adaptive icon
  (app/src/main/res/drawable/ic_launcher_foreground.xml + ic_launcher_background.xml).
  The book <path> is reused verbatim from that icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA21E"/>
      <stop offset="0.55" stop-color="#FF8F00"/>
      <stop offset="1" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0721A"/>
      <stop offset="1" stop-color="#E65100"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- amber field -->
  <rect width="1280" height="320" fill="url(#field)"/>

  <!-- icon tile -->
  <g filter="url(#soft)">
    <rect x="70" y="70" width="180" height="180" rx="42" fill="url(#tile)"/>
    <rect x="70" y="70" width="180" height="180" rx="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- open-book glyph (verbatim from ic_launcher_foreground.xml), centered in the tile -->
  <g transform="translate(102.4 97.6) scale(4.8)">
    <path fill="#FFFFFF" d="M21,5c-1.11,-0.35 -2.33,-0.5 -3.5,-0.5 -1.95,0 -4.05,0.4 -5.5,1.5 -1.45,-1.1 -3.55,-1.5 -5.5,-1.5S2.45,4.9 1,6v14.65c0,0.25 0.25,0.5 0.5,0.5 0.1,0 0.15,-0.05 0.25,-0.05C3.1,20.45 5.05,20 6.5,20c1.95,0 4.05,0.4 5.5,1.5 1.35,-0.85 3.8,-1.5 5.5,-1.5 1.65,0 3.35,0.3 4.75,1.05 0.1,0.05 0.15,0.05 0.25,0.05 0.25,0 0.5,-0.25 0.5,-0.5V6c-0.6,-0.45 -1.25,-0.75 -2,-1zM21,18.5c-1.1,-0.35 -2.3,-0.5 -3.5,-0.5 -1.7,0 -4.15,0.65 -5.5,1.5V8c1.35,-0.85 3.8,-1.5 5.5,-1.5 1.2,0 2.4,0.15 3.5,0.5v11.5z"/>
  </g>

  <!-- wordmark + taglines -->
  <g font-family="'DejaVu Sans','Liberation Sans',sans-serif" fill="#FFFFFF">
    <text x="300" y="135" font-size="74" font-weight="bold" letter-spacing="-1">Sermon Scanner</text>
    <text x="302" y="190" font-size="26" fill-opacity="0.96">Photograph a sermon handout &#8594; on-device OCR</text>
    <text x="302" y="224" font-size="26" fill-opacity="0.96">&#8594; Scripture anchor &#8594; songbird import JSON</text>
    <text x="302" y="268" font-size="19" fill-opacity="0.82" letter-spacing="0.3">Private &#183; sideloaded &#183; LAN-first &#183; Apache-2.0 fork of MakeACopy</text>
  </g>
</svg>
